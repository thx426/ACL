[project]
name = "trace-opd"
version = "0.1.0"
description = "TRACE-OPD: researcher-in-the-loop on-policy self-distillation (formal mechanism, CD-005)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Publication-figure suite (trace_opd.analysis); the viz observatory is
# stdlib-only on purpose and needs no extra.
analysis = ["matplotlib>=3.8", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
