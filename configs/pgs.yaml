# =============================================================================
# PGS 配置模板 —— 机制全部超参数、推荐默认值与依据(规范 docs/pgs-final-spec.md)。
#
# 【这是模板,不是任何一次实验的配置。】不要直接拿它跑实验:
#     python -m trace_opd.tools.config_tool new a800-pgs-s0   # 完整复制一份
#     # 编辑 configs/experiments/a800-pgs-s0.yaml,那份就是该实验的全部定义
#
# 为什么"完整复制"而非"只写差异":一次实验的配置应当自足——半年后单独打开就能读懂,
# 能与任何另一个实验直接 diff,且模板日后怎么改都不会追溯性改变已完成实验的含义。
#
# 损失面(规范 §2.6):纯 verl 原生 GRPO(ppo_loss)。不存在蒸馏配置——教师只经
# 采样端 SPS 保尾核进入;行为校正 W_beh 走 batch 的 rollout_is_weights 通道。
#
# ${VAR} 在加载时从环境变量展开(部署事实进 env,不进本文件)。
# 每项注释:含义 | 依据(h1/h3 pilot、4B/A800 主线与 162 主线的实测定版)。
# =============================================================================

run:
  name: pgs_v1              # 实验名;归档根 = runs_root/name(TRACE_RUN_DIR 由 launcher 导出)
  runs_root: /data4/ws/PGS   # 用户裁定 2026-08-04:ckpt/产物落 /data4(5.6T 余量;/data3 曾写满炸掉 C3)
  tape: true                 # 外部 researcher 全量交互磁带；每 worker 独立 jsonl

# 在线文档 producer 合同；steering.doc_source=static 时整节不参与旧指纹。
research:
  enabled: false             # researcher 源必须 true；static 源保持 false
  backend: external          # PGS 只允许 external researcher
  tool_protocol: fncall      # 强模型的 OpenAI function calling
  # 实验预算 | 用户裁定 2026-08-07:降 episode 开销。162 v4 实测 128 条 research
  # 会话消耗 3054 个 ALFWorld episode(中位 20/会话 = exps 中位 5 × k_default 4),
  # 而 rollout 生成占整步墙钟 84.5%。k_default 4→2 直接把 episode 数减半。
  # k_max 必须同步降:tools.py 是 min(k_req, k_max),留着 8 则模型填 8 就绕过新默认。
  n_exp: 8
  k_default: 2
  k_max: 4
  max_turns: 30
  wrapup_buffer: 2
  fetch_raw_limit: 20
  fetch_raw_max_chars: 16000
  doc_max_words: 3000
  gt: "off"                 # 动态源强制 off，特权 GT 不得进入 producer
  episode_temperature: 1.0   # research 实验仍由当前 step 冻结 policy 采样
  researcher_max_tokens: 8192
  session_timeout_s: 3600

narration:
  backend: engine            # 复用当前 SGLang rollout engine，不依赖 vLLM 私有面
  max_words: 1000
  temperature: 0.3

roles:
  researcher:
    endpoint: "http://127.0.0.1:18888/v1,http://127.0.0.1:18889/v1"
    model: qwen3.6-35b-a3b
    api_key_env: TRACE_RESEARCHER_API_KEY  # 仅变量名入配置/manifest，secret 不落盘
    mode: external_pool
    sidecar_sleep: false
    sidecar_sleep_level: 1
    dp_size: 0
    max_concurrency: 64       # 全局上限；16 workers 时每 worker=4
    temperature: 0.7
    max_tokens: 8192
    timeout_s: 600
    extra_body:
      chat_template_kwargs: {enable_thinking: false}

# ---------------------------------------------------------------------------
# Episode 协议(训练/评测同构,PG-3)
# ---------------------------------------------------------------------------
episode:
  max_env_steps: 30         # 每 episode 环境步预算 | 用户裁定 2026-07-23(原 50):
                            # cap=30 保住 h3 训后 94.2% 的成功(中位 11 步),
                            # 失败 episode 不再烧满预算
  max_assistant_turns: 40   # 会话轮上限 = 步预算 + 格式失败余量(加载强校验 turns > steps)
  max_tokens_per_turn: 2048 # 单轮生成上限(reasoning+action)| 2026-07-30 用户裁定改配置项;
                            # 打满该上限的轮 won 率只剩 10.5%(CD-008 实测)。
                            # 不进 objective_fingerprint(采样协议非优化目标)

alfworld:
  data_root: "${ALFWORLD_DATA}"              # json_2.1.1 数据根
  worker_python: "${ALFWORLD_WORKER_PYTHON}" # 引擎 venv 解释器(worker 子进程用)
  spawn_concurrency: 128    # 用户裁定 2026-08-04:并发拉满(80 核)
  start_timeout_s: 300      # 引擎 boot 超时 | h1 定版
  step_timeout_s: 120       # 单步执行超时 | h1 定版
  boot_concurrency: 32      # 数据构建期(build_datasets)引擎 boot 并发 | h3 定版

# ---------------------------------------------------------------------------
# 训练:verl GRPO —— launcher 由此生成完整命令行
# ---------------------------------------------------------------------------
train:
  model_path: "${TRACE_MODEL_PATH}"    # 基座:Qwen3-4B-Instruct-2507(PG-2)
  train_file: "${TRACE_TRAIN_FILE}"    # build_datasets 产出的 train parquet
  val_files:                            # 训练内 val = test 两 split 裸 greedy
    - "${TRACE_VAL_SEEN_FILE}"
    - "${TRACE_VAL_UNSEEN_FILE}"
  experiment_name: pgs_v1
  project_name: trace_opd
  n_gpus: 4                 # 机器相关,实验副本按实机改(162 共享期 2;A800-SXM 4)
  rollout_tp: 1             # 用户裁定 2026-08-04:推理 TP=1(4 卡 ⇒ 4 个独立 replica,无跨卡通信)
                            # zkgy 混卡纪律:TP 组必须落同型号卡对
  train_batch_size: 16      # 每 step 任务数 | 用户裁定 2026-07-23
  rollout_n: 8              # 每任务独立 student rollout 数 = GRPO 组大小 | 用户裁定;
                            # 约束:train_batch_size % agent_num_workers == 0
  ppo_mini_batch_size: 16   # 单位=任务数,verl 内部自动 ×rollout_n ⇒ 每 step 1 次全批更新
  lr: 1.0e-6                # | h3 定版
  lr_scheduler_type: constant   # h3 的实际调度,显式钉死保可比
  lr_warmup_steps_ratio: 0.0
  # ---- 序列容量参数(容量声明,非机制上限;包络变大按打包预算/SP/多机伸缩)----
  response_length: 32768    # episode 响应流预算(=评测预算,训评同构)| 用户裁定:
                            # 永不因输出长就不训练
  max_prompt_length: 2048   # 首轮 prompt 上限,超长 fail-loud(truncation=error)
  max_token_len_per_gpu: 34816   # 单序列容量声明:本值 × ulysses_sp ≥ prompt+response
  ppo_max_token_len_per_gpu: 8192      # actor 训练前反向微批打包预算/卡
                            # (logits 分量 = 本值 × vocab × 4B fp32;21.2GiB 事故后解耦)
  log_prob_max_token_len_per_gpu: 8192 # old_log_prob 推理打包预算/卡(同时产出熵曲线)
  ulysses_sp: 2             # 2026-08-04 OOM 实锤后切换:标定 run 第 3 步出现 32704
                            # 打满预算轨迹,rmpad=False 下单条 fp32 logits ≈18.5G 必爆
                            # (update_actor OOM: need 8.94G, free 1.15G)。sp=2 联动
                            # rmpad=True+FA2(已实测可用),序列切两卡;4B/SP2 是 162
                            # 历史成熟配置。执行档改动,不进指纹,两臂一致
                            # 需可用 flash-attn —— 仅 162 venv 有,A800-SXM 不可用)
  rollout_max_model_len: 40960   # rollout 单序列 ctx ≥ 教师前缀(scaffold+doc+obs)+ response
  rollout_max_num_batched_tokens: 8192  # vLLM chunked-prefill 预算 | 2026-07-28 用户裁定
                            # 模板级 8192(step-17 illegal-access 绕过 + 独占拓扑显存账);
                            # ⚠ 与大 sidecar 共存拓扑必须调回 ≤2048。
                            # 同时决定 prompt_logprobs 打分(SPS verify)的临时 logits
                            # 显存:本值 × vocab × 2B ×2
  rollout_gpu_mem: 0.6      # 2026-08-04 防御性下调 0.7→0.6:SPS 的 logprobs/
                            # prompt_logprobs 请求触发 vLLM 预算外分配(#5907,
                            # 无保护;实测峰值超预算 11-22G,78/80 贴上限)。让出
                            # 8G 结构性 headroom;代价=KV 池缩、preempt 增多
                            # (degrade 不崩)。与 R11a 历史事故同源
  rollout_max_num_seqs: 128 # 每 vLLM replica 并发序列上限(单 TP 上限,用户裁定)
  rollout_temperature: 1.0
  # ---- 信用分配单位(verl actor.loss_agg_mode)----
  # seq-mean-token-mean(2026-07-29 用户裁定默认):每条轨迹先 token-mean 再等权,
  # 长尾失败轨迹不再按长度拿投票权(CD-008:token-mean 下 85.5% token 来自失败轨迹)。
  loss_agg_mode: seq-mean-token-mean
  # ---- 稳定性/传输(均有事故背书,见注释)----
  vllm_rpc_timeout_ms: 300000     # EngineCore↔worker RPC 超时(默认 10s 长序列误判引擎死)
  agent_task_timeout_s: 2700      # R3 hang guard:单 prompt 墙钟上限;0=禁用
  fsdp_mode: shard                # shard | noshard(NO_SHARD≈DDP,卡间通信不可靠机器保留)
  fsdp_strategy: fsdp2            # fsdp2 | fsdp(NO_SHARD 逃生通道要 fsdp1)
  fsdp_size: 0                    # 0=全分片
  param_offload: true             # 关掉训练后显存高水位不归还,vLLM wake_up 拿不到物理页
  reshard_after_forward: true     # True=ZeRO-3
  dist_backend: ""                # 空=nccl;"cpu:gloo,cuda:gloo"=绕开 NCCL
  total_epochs: 2
  test_freq: 10             # 用户裁定:每 10 step 一个 val 点
  save_freq: 10             # 与 test_freq 同格:每个 val 点都有可回滚 ckpt
  max_ckpt_to_keep: 4       # 用户裁定:滚动保留 4 个 actor ckpt(单个 ≈45G)
  val_before_train: true    # step-0 val = 训前基线(三件套之①)
  resume_mode: auto
  loggers: [console, swanlab]
  agent_num_workers: 16     # 必须 = train_batch_size(用户长期裁定)

# ---------------------------------------------------------------------------
# PGS steering(规范 docs/pgs-final-spec.md §2;enabled=false ⇒ 纯 GRPO 基线臂,
# 与底座逐字节一致)
# ---------------------------------------------------------------------------
steering:
  enabled: false
  doc_source: static         # static|researcher；缺省 static 保持既有配置/指纹兼容
  doc_table: ""             # static 必需；researcher 允许空
  eta_max: 0.5              # 倾斜强度上限 η_max | 规范 §2.2;全词表密度比 ≤ e^{2ηc}
  c: 2.5                    # 截断参数(单点话语权限幅)| 规范 §2.1:上线前必须用
                            # 目标文档语境实测 ℓ 分布标定(G0 的 GT 语境分布不可迁移)
  b_max: 20.0               # D_∞ 逐轨迹预算(nats)| 用户裁定 2026-08-04 v2(10→20):
                            # ≈8 次整额干预,600-900 决策位的 1-2% 作用面;训练端
                            # per-token W 界 e^{±2ηc} 与本值无关,轨迹级界只影响
                            # per_decision 消融档;消融矩阵 {10,20,40}(第二轮预注册)
  topk: 64                  # 保尾核候选集 S = 两侧 top-K 并集
  obs_topk: 256             # draft/verify 引擎观测窗(top-K 明细宽度)| launcher
                            # 联动 vLLM max_logprobs ≥ 本值(启动期参数;codex
                            # 审阅 P0:hook 与 launcher 必须同源于此键)
  theta_d: 0.0              # D 主门冻结阈值 | 0=未标定占位,启用时启动校验拒绝;
                            # 用目标语境预扫描 D 分布的 P85 定值(规范 §2.3):
                            # 标定 run 配 theta_d=1e9(门恒关哨兵,行为=纯 bare)
                            # + epsilon=0(零干预)+ gate_rate_bounds=[0,1],跑几步后
                            # scripts/calibrate_theta_d.py 聚合 D 直方图出建议值
  gate_mode: adaptive       # 门控档(v3.3 M4 五档,进指纹):adaptive=D 硬门
                            # +ε 探针(v3.0)| always_on=恒 η_max(v3.2 maxopen)
                            # | entropy=G-E 软强度 w=min(1,h/H_q)(推荐首发;
                            # 熵在 draft 侧免费,低强度段跳过教师 verify)|
                            # d_var=G-D 软化 w=min(1,D/θ_D)(保教师异议信息,
                            # 熵门盲区=confidently-wrong 的对照)| soft_or=
                            # w=1−(1−w_E)(1−w_D)(两盲区互补,二版消融)
  gate_adaptive: true   # 率控自适应(用户裁定 2026-08-04):阈值(θ_D 与/或
                            # H_q,按 gate_mode 选信号)每 step EMA 追踪目标率;
                            # 标定 run 必须 false(冻结哨兵)
  gate_target_rate: 0.10    # 目标门率 q(用户裁定默认 10%;消融 {5,10,20}%)
  gate_ema_beta: 0.1        # EMA 慢速率 β;θ_D 语义 = EMA 初值(标定回填)
  epsilon: 0.05             # ε 探针翻转概率(倾向得分可辨识性)| 规范 §2.3
  gate_rate_bounds: [0.05, 0.25]  # 开门率合法带(spec 预注册区间;P85 标定的
                            # 设计触发率 15% 居中),越界告警不自动调(冻结语义)
  r_max: 4                  # 每轮拒绝上限(行为态,进记账)| 规范 §2.5
  w_beh_mode: per_token     # 训练侧行为校正口径(v3.3 M3 扩为五档,推荐 off):
                            # per_token(v3.0 忠实 IS)| per_decision | vtrace |
                            # off(免行为分布 IS,ratio 分母统一 π_old——MENTOR
                            #   口径;偏差由 asym advantage 的 [·]₊ 与 α 承接;
                            #   s3 实测拒绝位 W 0.42-0.65、远 rank 0.01-0.1 正是
                            #   吸收慢的第二重,v3.3 推荐默认)|
                            # shaped_reject(仅拒绝位 f(π)=π/(π+γ),LUFFY 反向
                            #   加权,低概率教学位拿更大梯度——消融臂)
  w_beh_shaped_gamma: 0.1   # shaped_reject 的 γ(LUFFY 实证默认;进指纹)
  # ---- 分臂采样(机制 v3.1;用户裁定 2026-08-06,进 objective_fingerprint)----
  # 每任务 n 个 rollout 的 steered 臂占比:round(n×fraction) 个副本走 SPS
  # 倾斜采样,其余为纯 π 的 bare 臂(空账 W≡1),同组进 GRPO。动机:全臂
  # 干预 (a) 污染训练读数(score=E_b[R]) (b) 组内方差坍缩+负样本稀疏化
  # (c) per-token W 的状态分布偏差随 B_∞ 放大。bare 臂恢复逐步真实读数与
  # 原生负梯度;混合组 baseline 把"教师能成/policy 失败"转成对比信号。
  # 曲线:rollout_extra/{won_bare_rate,won_steered_rate,steer_arm_gap}/mean。
  # 1.0=历史全臂(不进指纹,既有 run 可续);gap→0 是文档退场信号(退火二版)。
  steered_fraction: 0.5
  # ---- v3.3 M1/M2:不对称 advantage 与 α 有限期调度(用户裁定 2026-08-07;
  # docs/pgs-v33-mixed-policy-design.md;s3 双病诊断的结构性修复。
  # asym 档要求 train.adv_estimator: pgs_asym_grpo 联动,校验强制)----
  adv_mode: legacy_shared   # legacy_shared = v3.1 两臂同组共享 LOO(既有语义;
                            # s3 实证其臂间基线是弥散化膨胀病根)| asym =
                            # bare 组内 LOO + steered=[R−mean_bare]₊×α_t
                            # (失败零梯度不惩罚,MENTOR Eq.13;v3.3 推荐)
  steered_adv_weight: 1.0   # α_0(steered 超额权重初值)
  steered_adv_decay_steps: 0  # T_decay:cosine 衰减,t≥T 后 α=0 且 steered 臂
                            # 停产(教师=有限期脚手架);建议总步数×2/3(给
                            # 副动作族慢热留窗,162 实测 80-120 步起飞);
                            # 0=不衰减
  steered_adv_cap: 0.0      # 组内 steered advantage 总额上限(>0 激活;
                            # MENTOR expert_cap 防御闸,默认关)
  # ---- v3.3 M4:软强度门控(gate_mode: entropy|d_var|soft_or 时生效)----
  # 门 = 强度函数 w∈[0,1],η=η_max·w;G-E 熵门为推荐首发(信号在 draft 侧
  # 免费,w<w_min 的整段跳过教师 verify)。熵口径 = top-16 截断熵
  # (steering/hook.py ENTROPY_TOPK,与 dump 的 pi_top16 同口径,历史 dump
  # 直接可标定)。4B raw + researcher doc 语境标定(s3 step25/47/51,
  # n=1,433,050):P50≈0 / P75=.014 / P90=.822 / **P95=1.28** / P99=1.89。
  entropy_target_rate: 0.05 # 满强度位置目标占比(H_q 追踪 P_{1−rate};
                            # MENTOR entropy_p=0.95 同款)
  entropy_theta_init: 0.0   # H_q 初值(entropy/soft_or 档必填>0;上述语境
                            # 用 1.28 = P95)
  entropy_floor: 0.0        # H_q 硬地板(防阈值追熵坍缩,MENTOR max(·,1.5)
                            # 先例;上述语境建议 0.6 ≈「至少 78/22 犹豫」)
  intensity_w_min: 0.05     # w<w_min 视为关门(bypass;entropy 档整段全
                            # bypass 时跳过 verify——工程红利)
  budget_pacing: false      # true: unlocked(t)=U0+(B−U0)·[1−(1−t/T_max)^p],花费只动
                            # 已解锁额度(token-bucket 攒额);false=旧行为(t=0 全解锁)。
                            # T_max=episode.max_assistant_turns(环境硬配置,零任务先验)
  budget_u0: 5.0            # 初始拨付(nats;=2×δ_full,头部 2 次整额保任务理解期纠错)
  budget_profile_power: 2.0 # 曲线族 p:1=匀速;2=解锁速率随轮次线性衰减(默认档,
                            # 预算重心前移但全程非零);消融 p∈{1,2}
                            # (消融开关,规范 §2.6)

eval:
  response_budget: 32768    # 评测侧 episode token 预算 | h3 定版
  temperature: 0.0          # greedy | 评测口径(与 pilot 可比)
