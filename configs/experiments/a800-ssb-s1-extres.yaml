# =============================================================================
# SpreadsheetBench(verified 400)× 外部端点 researcher(v3.x 模式)。
# 与 a800-ssb-s1-selfres.yaml 的差异仅:research 走 external 35B 端点
# (backend/tool_protocol 回默认外部形态)、research_rl 整段禁用、
# rollout_n 仍 16(无 research 行)、run 名。用户裁定 2026-08-07:自进化
# 与外部端点两路 researcher 长期并存,SSB 两路都必须能跑——本文件即外部路。
# =============================================================================

run:
  name: ssb_s1_extres_n16
  runs_root: /fs/fast/u2021000902/wushang/workspace/TRACE-OPD-PGS/runs
  tape: true

environment:
  name: spreadsheetbench    # envs/registry.py 分派键(非默认值,进指纹)

research:
  enabled: true
  backend: external # 外部 35B 端点 researcher(roles.researcher)
  tool_protocol: fncall
  n_exp: 16
  k_default: 4
  k_max: 8
  max_turns: 30
  wrapup_buffer: 2
  fetch_raw_limit: 20
  fetch_raw_max_chars: 16000
  doc_max_words: 3000
  gt: "off"                 # SSB 下 gt_text 恒 None(golden=测试答案);此开关无效果位
  episode_temperature: 1.0
  researcher_max_tokens: 8192
  session_timeout_s: 3600
  # §7.5 必配(2026-08-08):流预算控制器与 prompt 上限(定值依据:4B 探针
  # 会话总量 p90=42k/max=58.8k;prompt 中位 1426/max 1598)
  session_token_budget: 32768
  max_prompt_tokens: 4096

narration:
  backend: engine
  max_words: 1000
  temperature: 0.3
  max_prompt_tokens: 6144   # §7.5 必配:叙述 prompt 上限(超出截轨迹渲染段)

roles:
  researcher:               # 外部路的实际消费端点
    endpoint: "http://127.0.0.1:18888/v1,http://127.0.0.1:18889/v1"
    model: qwen3.6-35b-a3b
    api_key_env: TRACE_RESEARCHER_API_KEY
    mode: external_pool
    sidecar_sleep: false
    sidecar_sleep_level: 1
    dp_size: 0
    max_concurrency: 64
    temperature: 0.7
    max_tokens: 8192
    timeout_s: 600
    extra_body:
      chat_template_kwargs: {enable_thinking: false}

episode:
  max_env_steps: 20         # 用户裁定 2026-08-07:SSB 默认 20 次工具调用
                            # (旧 skills_evolve 实证 max_turns=8,9B 下够用;
                            # 4B 放宽;按截断率数据再调)
  max_assistant_turns: 28   # 步预算 + 格式失败余量(校验 turns > steps)
  max_tokens_per_turn: 2048

spreadsheetbench:
  data_root: "${SSB_DATA}"  # verified 400 xlsx 根(服务器数据,env 注入)
  exec_concurrency: 32      # run_python 子进程全局并发门(按 worker 折算;
                            # CPU 饥饿纪律:环境子进程不得饿死推理引擎)
  python_timeout_s: 120
  recalc_timeout_s: 120   # 评分前 LibreOffice 公式重算(官方语义;需装
                          # libreoffice 或设 SSB_SOFFICE,缺失装配期即死)
  obs_max_chars: 3500       # 工具输出截断(保 <tool_response> 包裹完整)

train:
  model_path: "${TRACE_MODEL_PATH}"    # 基座 Qwen3-4B-Instruct-2507
  train_file: "${SSB_TRAIN_FILE}"      # build_dataset 产出 train.parquet(200)
  val_files:
    - "${SSB_VAL_FILE}"                # valid.parquet(200;seed42 后半)
  experiment_name: ssb_s1_extres_n16
  project_name: trace_opd
  n_gpus: 8
  rollout_tp: 1
  train_batch_size: 16
  rollout_n: 16             # 分臂 8 bare + 8 steered(+8 research 由 launcher 追加)
  ppo_mini_batch_size: 16
  lr: 1.0e-6
  lr_scheduler_type: constant
  lr_warmup_steps_ratio: 0.0
  response_length: 32768
  max_prompt_length: 4096   # SSB 首轮 = scaffold(含 tools 块)+ 指令 + 多 sheet
                            # 预览,比 ALFWorld 长;fail-loud 口径下取宽
  max_token_len_per_gpu: 36864   # ≥ max_prompt_length + response_length
  ppo_max_token_len_per_gpu: 8192
  log_prob_max_token_len_per_gpu: 8192
  ulysses_sp: 2
  rollout_max_model_len: 40960
  rollout_max_num_batched_tokens: 8192
  rollout_backend: sglang
  rollout_gpu_mem: 0.5
  rollout_max_num_seqs: 256
  rollout_temperature: 1.0
  loss_agg_mode: seq-mean-token-mean
  vllm_rpc_timeout_ms: 300000
  agent_task_timeout_s: 5400
  fsdp_mode: shard
  fsdp_strategy: fsdp2
  fsdp_size: 0
  param_offload: true
  reshard_after_forward: true
  dist_backend: ""
  total_epochs: 2
  test_freq: 10
  save_freq: 10
  max_ckpt_to_keep: 1
  val_before_train: true
  resume_mode: auto
  loggers: [console, swanlab]
  agent_num_workers: 16

steering:
  enabled: true
  doc_source: researcher
  doc_table: ""
  eta_max: 0.5
  c: 2.5                    # ⚠ SSB 文档语境必须重标定(规范 §2.1;此值为
                            # ALFWorld 语境起点,起跑前标定三件套)
  b_max: .inf
  topk: 64
  obs_topk: 256
  theta_d: 0.0
  gate_mode: always_on
  gate_adaptive: false
  gate_target_rate: 0.10
  gate_ema_beta: 0.1
  epsilon: 0.0
  gate_rate_bounds: [0.0, 1.0]
  r_max: 0
  w_beh_mode: per_token
  steered_fraction: 0.5
  budget_pacing: false
  budget_u0: 5.0
  budget_profile_power: 2.0

eval:
  response_budget: 32768
  temperature: 0.0

research_rl:
  enabled: false            # 外部 researcher 路:无自体双目标(24 行退化 16 行)
  research_n: 8
  prefix_quantiles: [0.05, 0.15, 0.30, 0.50, 0.75]
  continuation_samples: 4
  continuation_temperature: 1.0
  researcher_temperature: 1.0
  research_rl_weight: 0.1
  research_warmup_steps: 0
  research_max_sample_tokens: 24576
