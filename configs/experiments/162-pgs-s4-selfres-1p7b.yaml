# =============================================================================
# 162 · Qwen3-1.7B · v4 self-researcher(GO-V4 全流程)
# 由 a800-pgs-s4-selfres.yaml 机械改写:**只改机器与身份**,机制参数
# (research_rl 全段、steering v3.2 全套、24 行布局 8+8+8)与 A800 版逐字一致,
# 两机结果可直接对照。
# 起点 policy = 阶段C 产出的 researcher SFT ckpt(经 TRACE_MODEL_PATH 注入),
# 不是原始 1.7B —— v4 要求 researcher 能力已冷启动。
# =============================================================================
# =============================================================================
# v4 自体研究员(self-researcher)双目标 RL 样例配置(机制 v4.0,
# docs/pgs-self-researcher-design.md;基于 s3 冷起 maxopen 档派生)。
# 每任务 24 行:8 steered + 8 bare + 8 research;researcher = policy 本体
# (engine + TextProtocol,无 external 35B 依赖);reward = 教师在 bare
# 轨迹前缀上的续写成功比例;joint 双目标一次 backward。
# =============================================================================
# =============================================================================
# A800 / 原始 Qwen3-4B(无 SFT 冷启动)/ n=16 分臂 8+8 / maxopen 档(机制 v3.2)
# 用户裁定 2026-08-06:一半 policy 自身、一半最大程度干预——无门判定
# (gate_mode: always_on)+ 无预算约束(b_max: .inf);outcome reward +
# bare 臂锚提供信号保证。科学定位:PGS 采样端干预能否从零起点(bare≈0%)
# 拉起能力(SFT 冷启动的替代通道测试)。
# ⚠ TRACE_MODEL_PATH 必须指向原始 Qwen3-4B-Instruct-2507(HF 目录),
#    不是任何 SFT/RL checkpoint —— 起跑前 preflight 首查项。
# =============================================================================
# A800 4B PGS/SGLang dynamic-researcher formal experiment.
# Derived mechanically from the recorded GT formal source; treatment changes only the document producer.
# ═══ PGS steering 臂 S2 · SGLang 后端(A800 8卡)═══
# 2026-08-05 用户裁定:全栈 rollout 引擎切 SGLang(原生 logprob_start_len
# tail-only + radix 前缀复用 ⇒ verify 成本 O(前缀)→O(draft 段),根治 B=400
# 平方墙钟)。与 162-pgs-s2.yaml 的唯一差异 = rollout_backend + run 名;
# 后端属执行层,不进 objective_fingerprint(两配置指纹相同,结果可比)。
# 用户裁定 2026-08-05:s1 首查暴露 θ_D 自适应死锁(worker 分片欠观测,gate.py
# 已修)+ 干预 98.7% 坍缩在 turn 0 前 0.4%(预算头部耗尽)。S2 = 修复后重起臂:
# B_∞ 20→40(用户裁定 v3);预算均衡化(pacing)方案待裁定后在此加键。
# 相对 s1 的差异仅 steering 段(b_max/theta_d 注释),train 段与 base/s1 零漂移。
# =============================================================================
# PGS 配置模板 —— 机制全部超参数、推荐默认值与依据(规范 docs/pgs-final-spec.md)。
#
# 【这是模板,不是任何一次实验的配置。】不要直接拿它跑实验:
#     python -m trace_opd.tools.config_tool new a800-pgs-s0   # 完整复制一份
#     # 编辑 configs/experiments/a800-pgs-s0.yaml,那份就是该实验的全部定义
#
# 为什么"完整复制"而非"只写差异":一次实验的配置应当自足——半年后单独打开就能读懂,
# 能与任何另一个实验直接 diff,且模板日后怎么改都不会追溯性改变已完成实验的含义。
#
# 损失面(规范 §2.6):纯 verl 原生 GRPO(ppo_loss)。不存在蒸馏配置——教师只经
# 采样端 SPS 保尾核进入;行为校正 W_beh 走 batch 的 rollout_is_weights 通道。
#
# ${VAR} 在加载时从环境变量展开(部署事实进 env,不进本文件)。
# 每项注释:含义 | 依据(h1/h3 pilot、4B/A800 主线与 162 主线的实测定版)。
# =============================================================================

run:
  name: pgs_s4_selfres_1p7b_162
  runs_root: /data4/ws/PGS/runs
  tape: true

# ---------------------------------------------------------------------------
# 在线 researcher 文档 producer（当前冻结 policy 做独立 ALFWorld 实验）
# ---------------------------------------------------------------------------
research:
  enabled: true
  backend: engine   # v4 自体:researcher chat 走本机引擎
  tool_protocol: text  # v4 自体:TextProtocol(policy 无 fncall parser)
  # 用户裁定 2026-08-07(原 n_exp 16 / k_default 4 / k_max 8):降 episode 开销。
  # 实测 128 条 research 会话消耗 3054 个 ALFWorld episode(中位 20/会话),
  # 而 timing_s/gen 占整步 84.5%(3810s/4508s)。k 4→2 使 episode 数减半;
  # k_max 同步 8→4,否则 tools.py 的 min(k_req,k_max) 允许模型填 8 绕过新默认。
  n_exp: 8                   # 每 (step, task) 最多 8 次 researcher 实验
  k_default: 2               # 每次 run_experiment 默认跑 2 个 episode
  k_max: 4                   # 模型可自主提到 4(= 原默认),不能更高
  max_turns: 30
  wrapup_buffer: 2
  fetch_raw_limit: 20
  fetch_raw_max_chars: 16000
  doc_max_words: 3000
  gt: "off"
  episode_temperature: 1.0
  researcher_max_tokens: 8192
  session_timeout_s: 3600
  # §7.5 必配(2026-08-08):流预算控制器与 prompt 上限(定值依据:4B 探针
  # 会话总量 p90=42k/max=58.8k;prompt 中位 1426/max 1598)
  session_token_budget: 38912
  max_prompt_tokens: 2048

narration:
  backend: engine
  max_words: 1000
  temperature: 0.3
  max_prompt_tokens: 6144   # §7.5 必配:叙述 prompt 上限(超出截轨迹渲染段)

roles:
  researcher:
    endpoint: "http://127.0.0.1:18888/v1,http://127.0.0.1:18889/v1"
    model: qwen3.6-35b-a3b
    api_key_env: TRACE_RESEARCHER_API_KEY
    mode: external_pool
    sidecar_sleep: false
    sidecar_sleep_level: 1
    dp_size: 0
    max_concurrency: 64
    temperature: 0.7
    max_tokens: 8192
    timeout_s: 600
    extra_body:
      chat_template_kwargs: {enable_thinking: false}

# ---------------------------------------------------------------------------
# Episode 协议(训练/评测同构,PG-3)
# ---------------------------------------------------------------------------
episode:
  max_env_steps: 30         # 每 episode 环境步预算 | 用户裁定 2026-07-23(原 50):
                            # cap=30 保住 h3 训后 94.2% 的成功(中位 11 步),
                            # 失败 episode 不再烧满预算
  max_assistant_turns: 40   # 会话轮上限 = 步预算 + 格式失败余量(加载强校验 turns > steps)
  max_tokens_per_turn: 4096 # 任务执行 agent 单轮生成上限(reasoning+action)|
                            # 2026-08-07 用户裁定 2048→4096("researcher 8K,
                            # 任务执行 agent 4K")。原值背景:打满 2048 的轮 won 率
                            # 只剩 10.5%(CD-008 实测)——该读数是在 2048 上限下取的,
                            # 放宽后需重测。不进 objective_fingerprint(采样协议非优化目标)

alfworld:
  data_root: "${ALFWORLD_DATA}"              # json_2.1.1 数据根
  worker_python: "${ALFWORLD_WORKER_PYTHON}" # 引擎 venv 解释器(worker 子进程用)
  spawn_concurrency: 64    # 用户裁定 2026-08-04:并发拉满(80 核)
  start_timeout_s: 300      # 引擎 boot 超时 | h1 定版
  step_timeout_s: 120       # 单步执行超时 | h1 定版
  boot_concurrency: 32      # 数据构建期(build_datasets)引擎 boot 并发 | h3 定版

# ---------------------------------------------------------------------------
# 训练:verl GRPO —— launcher 由此生成完整命令行
# ---------------------------------------------------------------------------
train:
  model_path: "${TRACE_MODEL_PATH}"    # 基座:Qwen3-4B-Instruct-2507(PG-2)
  train_file: "${TRACE_TRAIN_FILE}"    # build_datasets 产出的 train parquet
  val_files:                            # 训练内 val = test 两 split 裸 greedy
    - "${TRACE_VAL_SEEN_FILE}"
    - "${TRACE_VAL_UNSEEN_FILE}"
  experiment_name: pgs_s4_selfres_1p7b_162
  project_name: trace_opd
  n_gpus: 4                 # 162 实机四卡(2×A800 PCIe + 2×A100 PCIe);TP=1 保持,
                            # 小模型单卡推理即可,四卡 = 四个独立 rollout replica
  rollout_tp: 1             # 用户裁定 2026-08-04:推理 TP=1(4 卡 ⇒ 4 个独立 replica,无跨卡通信)
                            # zkgy 混卡纪律:TP 组必须落同型号卡对
  train_batch_size: 16      # 每 step 任务数 | 用户裁定 2026-07-23
  rollout_n: 16             # 用户裁定 2026-08-06:16 = 分臂 8 bare + 8 steered
                            # (p̂/q̂ 分辨率 1/8;组统计更稳;rollout 吞吐 ×2)
                            # 约束:train_batch_size % agent_num_workers == 0
  ppo_mini_batch_size: 16   # 单位=任务数,verl 内部自动 ×rollout_n ⇒ 每 step 1 次全批更新
  lr: 1.0e-6                # | h3 定版
  lr_scheduler_type: constant   # h3 的实际调度,显式钉死保可比
  lr_warmup_steps_ratio: 0.0
  # ---- 序列容量参数(容量声明,非机制上限;包络变大按打包预算/SP/多机伸缩)----
  response_length: 38912    # episode 响应流预算(=评测预算,训评同构)| 用户裁定:
                            # 永不因输出长就不训练。2026-08-07 由 32768 提到
                            # 38912 = rollout_max_model_len(40960) − max_prompt_length(2048),
                            # 即在 1.7B 位置编码物理上限内**顶到最大**。
                            # 依据:research 会话实测 p90=39838、61% 的行堆在
                            # (36864,40960] 且 finalize 成功率 0% —— 撞的是 ctx 墙。
  max_prompt_length: 2048   # 首轮 prompt 上限,超长 fail-loud(truncation=error)
  max_token_len_per_gpu: 40960   # 单序列容量声明:本值 × ulysses_sp ≥ prompt+response
                            # (40960×2=81920 ≥ 2048+38912=40960,2× 余量)
  ppo_max_token_len_per_gpu: 8192      # actor 训练前反向微批打包预算/卡
                            # (logits 分量 = 本值 × vocab × 4B fp32;21.2GiB 事故后解耦)
  log_prob_max_token_len_per_gpu: 8192 # old_log_prob 推理打包预算/卡(同时产出熵曲线)
  ulysses_sp: 2             # 2026-08-04 OOM 实锤后切换:标定 run 第 3 步出现 32704
                            # 打满预算轨迹,rmpad=False 下单条 fp32 logits ≈18.5G 必爆
                            # (update_actor OOM: need 8.94G, free 1.15G)。sp=2 联动
                            # rmpad=True+FA2(已实测可用),序列切两卡;4B/SP2 是 162
                            # 历史成熟配置。执行档改动,不进指纹,两臂一致
                            # 需可用 flash-attn —— 仅 162 venv 有,A800-SXM 不可用)
  rollout_max_model_len: 40960   # = Qwen3-1.7B 的 max_position_embeddings,物理上限。
                            # 用户 2026-08-07 裁定"上下文 256K",但实测不可执行:
                            #   ValueError: max_model_len (262144) should be less than
                            #   or equal to max_position_embeddings (40960)
                            # (verl async_sglang_server.py:245 硬校验;模型 config.json
                            #  的 rope_scaling 为 None,且 verl 未暴露 json_model_override_args)。
                            # 要真正超过 40960 只能改模型 config 开 YaRN —— 那是改基座
                            # 而非改配置,会影响占绝大多数 token 的 executor 短轨迹,
                            # 已升级用户裁定,未擅自实施。
                            # ⚠ 这堵墙是 research 会话失败的物理根因:respLen 落在
                            #   (36864, 40960] 的 78 条(61%)finalize 成功率 **0%**,
                            #   而 ≤32768 的 40 条成功率 85–93%。
  rollout_max_num_batched_tokens: 32768 # 用户裁定 2026-08-07(原 8192)。
                            # 原值背景:2026-07-28 定的模板级 8192 是 **vLLM 时代**
                            # 为绕 step-17 illegal-access + 独占拓扑显存账设的,
                            # 而本 run 的后端已是 SGLang(rollout_backend: sglang)。
                            # 实测 rollout 阶段只占 42GB/80GB、timing_s/gen 占整步
                            # 84.5%、吞吐仅 280 token/s/卡 —— 批次预算是可疑的绑定约束。
                            # ⚠ 与大 sidecar 共存拓扑必须调回 ≤2048;本 run 是 v4 自体
                            #   researcher(engine-backed,无 sidecar),不受该约束。
                            # 同时决定 prompt_logprobs 打分(SPS verify)的临时 logits
                            # 显存:本值 × vocab × 2B ×2 —— 32768×151936×2×2 ≈ 19.9GB,
                            # 在 gpu_memory_utilization=0.5 留出的余量内。
  rollout_backend: sglang   # 2026-08-05 用户裁定(vllm=回摆通道);verl 侧自动映射
                            # mem_fraction_static←rollout_gpu_mem、
                            # max_running_requests←rollout_max_num_seqs;
                            # vLLM 的 max_logprobs 启动参数在 sglang 下不需要
                            # (top_logprobs_num 逐请求)
  rollout_gpu_mem: 0.5      # 2026-08-04 防御性下调 0.7→0.6:SPS 的 logprobs/
                            # prompt_logprobs 请求触发 vLLM 预算外分配(#5907,
                            # 无保护;实测峰值超预算 11-22G,78/80 贴上限)。让出
                            # 8G 结构性 headroom;代价=KV 池缩、preempt 增多
                            # (degrade 不崩)。与 R11a 历史事故同源
  rollout_max_num_seqs: 256 # 用户裁定：每个 SGLang TP1 replica 的在途序列容量上限
  rollout_temperature: 1.0
  # ---- 信用分配单位(verl actor.loss_agg_mode)----
  # seq-mean-token-mean(2026-07-29 用户裁定默认):每条轨迹先 token-mean 再等权,
  # 长尾失败轨迹不再按长度拿投票权(CD-008:token-mean 下 85.5% token 来自失败轨迹)。
  loss_agg_mode: seq-mean-token-mean
  # ---- 稳定性/传输(均有事故背书,见注释)----
  vllm_rpc_timeout_ms: 300000     # EngineCore↔worker RPC 超时(默认 10s 长序列误判引擎死)
  agent_task_timeout_s: 5400      # researcher session hard wall=3600s；外层 guard 必须更长
  fsdp_mode: shard                # shard | noshard(NO_SHARD≈DDP,卡间通信不可靠机器保留)
  fsdp_strategy: fsdp2            # fsdp2 | fsdp(NO_SHARD 逃生通道要 fsdp1)
  fsdp_size: 0                    # 0=全分片
  param_offload: true             # 关掉训练后显存高水位不归还,vLLM wake_up 拿不到物理页
  reshard_after_forward: true     # True=ZeRO-3
  dist_backend: ""                # 空=nccl;"cpu:gloo,cuda:gloo"=绕开 NCCL
  total_epochs: 2
  test_freq: 10             # 用户裁定:每 10 step 一个 val 点
  save_freq: 10             # 与 test_freq 同格:每个 val 点都有可回滚 ckpt
  max_ckpt_to_keep: 1       # 162 /data4 余量充足,但沿用只保留最新的滚动纪律
  val_before_train: true    # step-0 val = 训前基线(三件套之①)
  resume_mode: auto
  loggers: [console, swanlab]
  agent_num_workers: 16     # 必须 = train_batch_size(用户长期裁定)

# ---------------------------------------------------------------------------
# PGS steering(规范 docs/pgs-final-spec.md §2;enabled=false ⇒ 纯 GRPO 基线臂,
# 与底座逐字节一致)
# ---------------------------------------------------------------------------
steering:
  enabled: true
  doc_source: researcher      # 每 (global_step, task_id) 在线动态生产一次，组内 n=8 共享
  doc_table: ""               # 动态源不读取静态 GT 表
  eta_max: 0.5              # 倾斜强度上限 η_max | 规范 §2.2;全词表密度比 ≤ e^{2ηc}
  c: 2.5                    # 截断参数(单点话语权限幅)| 规范 §2.1:上线前必须用
                            # 目标文档语境实测 ℓ 分布标定(G0 的 GT 语境分布不可迁移)
  b_max: .inf               # 用户裁定 2026-08-06(v3.2 默认档):预算不设限——
                            # spent 照实累计为观察量,admissible_eta 永不缩。
                            # (历史 v4 语境:20→400,
                            # 探索档"先试一试"):s1 实测换 token 仅 ~0.56 次/轨迹,
                            # 对多轮长轨迹要显著提升;且总量对 η 一阶不敏感(次数=
                            # B/2ηc 与拒绝率∝η 相消),B 是总量主旋钮。δ=2.5 保守
                            # 扣费 ⇒ 160 次整额等价/轨迹 ≈ 全轨迹候选(标定口径
                            # ~2160)的 7.4%,与 q=10% 门率接近匹配(预算从硬瓶颈
                            # 转为轻约束)。per-token W 界 e^{±2ηc} 与本值无关。
                            # ⚠ 墙钟预警:verify 覆盖面随之扩到近全轨迹,教师
                            # prefill 无 KV 复用(vLLM prompt_logprobs 禁 prefix-
                            # cache)⇒ 预计 2-4× base,s2 首 step 实测定夺。
                            # 后续方向(用户 2026-08-05 记账,暂不实施):B 自适应
                            # (跨 benchmark 免先验)+ B 训练期衰减调度(类 lr
                            # cosine,随成功率退火趋纯 on-policy)
  topk: 64                  # 保尾核候选集 S = 两侧 top-K 并集
  obs_topk: 256             # draft/verify 引擎观测窗(top-K 明细宽度)| launcher
                            # 联动 vLLM max_logprobs ≥ 本值(启动期参数;codex
                            # 审阅 P0:hook 与 launcher 必须同源于此键)
  theta_d: 0.0    # always_on 档 θ_D 无语义免标定(校验跳过;历史 P90=0.0338
                            # 门率对应)。自适应 EMA 会自校(gate.py 分片死锁已修,
                            # 2026-08-05):s1 实测 verify 窗口口径的均衡 θ 显著更高
                            # (开门位置 D med 0.112),修复后 EMA 约 β_eff≈0.34/次
                            # (worker 每 ~4 step 攒够 min_obs 更新一次)自动爬升;
                            # 若预算均衡化(pacing)落地则窗口≈全轨迹口径,本初值近均衡。
                            # 全量分位:P50 .0027/P85 .0203/P90 .0338/P95 .0721/P99 .3033
  gate_mode: always_on      # 机制 v3.2(用户裁定 2026-08-06):无门判定,每个
                            # 候选位置恒 η=η_max(最大程度干预;θ 标定/探针/率
                            # 告警子系统整体退役)。进 objective_fingerprint
  gate_adaptive: false      # always_on 档强制显式关闭(参数纪律,校验拒绝 true)
  gate_target_rate: 0.10    # 目标门率 q(用户裁定默认 10%;消融 {5,10,20}%)
  gate_ema_beta: 0.1        # EMA 慢速率 β;θ_D 语义 = EMA 初值(标定回填)
  epsilon: 0.0              # always_on 档无门决定可翻转(校验拒绝非 0);因果
                            # 读数由分臂轨迹级对照(δ=steer_arm_gap)承担
  gate_rate_bounds: [0.0, 1.0]    # always_on 档告警语义关闭(门率恒 1)
  r_max: 0                  # 无上限(用户裁定 2026-08-06,v3.2 默认):干预完全按
                            # 两分布差异进行;拒绝计数照记为观察量,尾部墙钟由
                            # 监控兜底(cap 行为态随门/预算同批退役)
  w_beh_mode: per_token     # 训练侧行为校正口径:per_token(默认)| per_decision | vtrace
                            # (消融开关,规范 §2.6)
  # ---- 分臂采样(机制 v3.1;用户裁定 2026-08-06,进 objective_fingerprint)----
  # 每任务 n 个 rollout 的 steered 臂占比:round(n×fraction) 个副本走 SPS
  # 倾斜采样,其余为纯 π 的 bare 臂(空账 W≡1),同组进 GRPO。动机:全臂
  # 干预 (a) 污染训练读数(score=E_b[R]) (b) 组内方差坍缩+负样本稀疏化
  # (c) per-token W 的状态分布偏差随 B_∞ 放大。bare 臂恢复逐步真实读数与
  # 原生负梯度;混合组 baseline 把"教师能成/policy 失败"转成对比信号。
  # 曲线:rollout_extra/{won_bare_rate,won_steered_rate,steer_arm_gap}/mean。
  # 1.0=历史全臂(不进指纹,既有 run 可续);gap→0 是文档退场信号(退火二版)。
  steered_fraction: 0.5
  # ---- 预算解锁曲线(pacing;2026-08-05 用户裁定,修 s1 头部坍缩:98.7% 干预
  # 堆 turn 0 前 0.4%。docs/pgs-budget-pacing-design.md)----
  budget_pacing: false      # b_max=inf 下解锁曲线无定义(校验拒绝组合);全程
                            # 全额可用。(原 pacing 注释:unlocked(t)=U0+(B−U0)·[1−(1−t/T_max)^p];花费只动已
                            # 解锁额度(token-bucket 攒额);T_max=episode.
                            # max_assistant_turns(环境硬配置,零任务先验)
  budget_u0: 5.0            # 初始拨付(=2×δ_full,头部 2 次整额保任务理解期纠错)
  budget_profile_power: 2.0 # 曲线族 p:1=匀速;2=解锁速率随轮次线性衰减(用户提议
                            # 档,预算重心前移但全程非零);消融 p∈{1,2}(第二轮)

eval:
  response_budget: 38912    # 评测侧 episode token 预算 | 随 train.response_length
                            # 同步上调(训评同构口径必须一致)| 原 h3 定版 32768
  temperature: 0.0          # greedy | 评测口径(与 pilot 可比)

# ---------------------------------------------------------------------------
# v4 自体研究员双目标 RL(机制 v4.0;全套进 objective_fingerprint)
# ---------------------------------------------------------------------------
research_rl:
  enabled: true
  research_n: 8               # 每任务研究会话数 = research GRPO 组大小(用户裁定默认 8)
  prefix_quantiles: [0.05, 0.15, 0.30, 0.50, 0.75]   # policy 生成 token 比例分位
  continuation_samples: 4     # 每 (doc, prefix) 续写次数(用户裁定默认 4)
  continuation_temperature: 1.0
  researcher_temperature: 1.0 # 自体 researcher chat 采样温度(用户裁定默认 1.0)
  research_rl_weight: 0.1     # λ_r(reward 预乘实现;seq-mean 行等权口径)
  research_warmup_steps: 0
  research_max_sample_tokens: 40960   # research 行超长 ⇒ mask 全 0(零梯度)
                            # 2026-08-07 由 24576 提到 40960(= ctx 物理上限,
                            # 即"不再由本阈额外砍任何行")。实测(162 冒烟 step1,
                            # 128 条 research 行):respLen p50=37185、p90=39838、
                            # max=44507 —— 旧阈 24576 恰好切在分布左尾外,把 82%
                            # 的 research 行 mask 成零梯度,λ_r 的实际有效权重只剩
                            # 0.1×18%≈0.018。且未超限的 23 行读数很好(r_raw 非零
                            # 87%/中位 0.450/valid_conts 中位 20),证明砍掉的是
                            # 有效信号而非噪声。
                            # 代价小:overlong 行本就完整进 batch 参与 forward
                            # (只是 mask 置 0),抬阈只是让已付出的 forward 产生
                            # 梯度,显存增量主要在 backward。
                            # ⚠ 抬到 40960 后仍会有 ~4% 的行超限 —— 那些是撞 ctx
                            #   墙的行,真正的解法是扩 ctx(见 rollout_max_model_len
                            #   的注释),本阈已不再是绑定约束。
